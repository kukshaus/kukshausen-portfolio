# nginx server configuration for sergej.kukshausen.me
# Fixes from the 2026-10-16 SEO audit that cannot be done in the static files:
#   301 (not 302) to HTTPS, www -> apex, HSTS + security headers, Cache-Control,
#   manifest MIME type, /index.html -> /, brotli before gzip, no gzip on compressed types.
#
# Install:
#   1. certbot --nginx -d sergej.kukshausen.me -d www.sergej.kukshausen.me   (adds www to the cert)
#   2. copy this file to /etc/nginx/sites-available/sergej.kukshausen.me and symlink into sites-enabled
#      (replace the existing server blocks for this host; keep the ssl_certificate paths certbot wrote)
#   3. nginx -t && systemctl reload nginx
#   4. verify: curl -sI http://sergej.kukshausen.me/ | head -1          -> HTTP/1.1 301
#              curl -sI https://www.sergej.kukshausen.me/ | head -1     -> 301
#              curl -sI https://sergej.kukshausen.me/ | grep -i strict  -> HSTS present
#              curl -sI https://sergej.kukshausen.me/site.webmanifest | grep -i content-type -> application/manifest+json
#
# After the CSP has run one week in Report-Only without console errors, rename the header to
# Content-Security-Policy. The script hash below is the sha256 of the one inline script
# `document.documentElement.classList.add('js');` (recomputed on each build: see sa2BD07tH4oO53uT1B5vNSLM2+gcrREM4WTXttKp6oU= below).

map $uri $cache_control {
    ~^/assets/(main|style|legal)-[A-Za-z0-9_-]{8}\.(js|css)$   "public, max-age=31536000, immutable";
    ~^/assets/(fonts|images)/                                  "public, max-age=2592000, stale-while-revalidate=86400";
    ~^/(favicon\.ico|favicon\.svg|favicon-32\.png|apple-touch-icon\.png|icon-\d+\.png)$ "public, max-age=604800";
    ~\.(pdf)$                                                  "public, max-age=86400";
    ~\.(html|xml|txt|webmanifest)$                             "no-cache";
    ~^/$                                                       "no-cache";
    default                                                    "public, max-age=3600";
}

types {
    application/manifest+json webmanifest;
}

# ---- port 80: everything to HTTPS apex, permanently ----
server {
    listen 80;
    listen [::]:80;
    server_name sergej.kukshausen.me www.sergej.kukshausen.me;
    location /.well-known/acme-challenge/ { root /var/www/sergej.kukshausen.me; }
    location / { return 301 https://sergej.kukshausen.me$request_uri; }
}

# ---- www over HTTPS: to apex ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sergej.kukshausen.me;
    # ssl_certificate / ssl_certificate_key: managed by certbot (same cert as below)
    return 301 https://sergej.kukshausen.me$request_uri;
}

# ---- apex ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    server_name sergej.kukshausen.me;
    root /var/www/sergej.kukshausen.me;   # adjust to the checkout the deploy hook updates
    index index.html;
    charset utf-8;
    server_tokens off;

    # ssl_certificate /etc/letsencrypt/live/sergej.kukshausen.me/fullchain.pem;   # managed by certbot
    # ssl_certificate_key /etc/letsencrypt/live/sergej.kukshausen.me/privkey.pem; # managed by certbot

    add_header Alt-Svc 'h3=":443"; ma=2592000' always;
    add_header Cache-Control $cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-sa2BD07tH4oO53uT1B5vNSLM2+gcrREM4WTXttKp6oU='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # brotli first, gzip as fallback; never recompress already-compressed types
    brotli on;
    brotli_comp_level 6;
    brotli_types text/html text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    absolute_redirect off;   # keep redirects relative so no upstream port leaks into Location
    location = /index.html { return 301 /; }
    location = /assets/sergej-kukshausen-cv.pdf { return 301 /Sergej_Kukshausen_CV.pdf; }
    location = /README.md { return 404; }
    location /.git { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
